spring:
  application:
    name: security-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8082
logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}