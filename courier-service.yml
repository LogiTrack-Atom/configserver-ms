spring:
  application:
    name: courier-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8081
clients:
  security:
    base-url: ${SECURITY_SERVICE_URL:http://localhost:8082}
logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}