spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/applications/apisecurity/**
              filters:
                - StripPrefix=2
            - id: courier-service
              uri: lb://COURIER-SERVICE
              predicates:
                - Path=/applications/apicourier/**
              filters:
                - StripPrefix=2
            - id: shipment-service
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/applications/apishipment/**
              filters:
                - StripPrefix=2
server:
  port: ${GATEWAY_SERVER_PORT:8066}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8065/eureka/}
  instance:
    prefer-ip-address: true
logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
