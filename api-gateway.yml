spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: security-service
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/auth/**
        - id: courier-service
          uri: lb://COURIER-SERVICE
          predicates:
            - Path=/couriers/**
        - id: shipment-service
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/shipments/**
server:
  port: ${GATEWAY_SERVER_PORT:8060}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8065/eureka/}
  instance:
    prefer-ip-address: true
logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    clock-skew: 60s
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
